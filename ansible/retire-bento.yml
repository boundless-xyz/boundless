---
- name: Retire managed Bento workloads
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Check whether the retired host is reachable
      block:
        - name: Wait briefly for the retired host's SSH port
          ansible.builtin.wait_for:
            # Delegation changes connection variables to localhost's values.
            host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
            port: "{{ hostvars[inventory_hostname].ansible_port | default(22) }}"
            connect_timeout: 3
            timeout: 10
          delegate_to: localhost
          become: false
          check_mode: false
          register: retirement_reachability
      rescue:
        - name: Report the skipped retired host
          ansible.builtin.debug:
            msg: "Skipping unreachable retired host {{ inventory_hostname }}; no host cleanup was performed."
    - name: Skip the unreachable retired host
      ansible.builtin.meta: end_host
      when: retirement_reachability is failed
  tasks:
    - name: Read installed service state
      ansible.builtin.service_facts:

    - name: Stop and disable the workload and telemetry services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - bento.service
        - vector.service
      when: item in ansible_facts.services

    - name: Find remaining Bento containers
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - -aq
          - --filter
          - "label=com.docker.compose.project={{ item }}"
      loop:
        - bento
        - prover
      register: retired_containers
      changed_when: false
      check_mode: false

    - name: Remove remaining containers from the retired stack
      ansible.builtin.command:
        argv:
          - docker
          - rm
          - --force
          - "{{ item }}"
      loop: "{{ retired_containers.results | map(attribute='stdout_lines') | flatten | unique }}"
      changed_when: true

    - name: Remove the retired workload service definition
      ansible.builtin.file:
        path: /etc/systemd/system/bento.service
        state: absent
      notify: Reload systemd after Bento retirement

  handlers:
    - name: Reload systemd after Bento retirement
      ansible.builtin.systemd_service:
        daemon_reload: true
